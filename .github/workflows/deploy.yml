name: Deploy to Digital Ocean

on:
  push:
    branches:
      - staging
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Digital Ocean Deployment

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{
            github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Digital Ocean (Staging)
        if: github.ref == 'refs/heads/staging'
        uses: appleboy/ssh-action@master

        env:
          IMAGE_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ github.sha }}


        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
         
          envs: IMAGE_TAG

          script: |
            cd /root/var/www/arkrides_nestjs_backend

            echo "${{ secrets.ENV_STAGING }}" > .env

            echo "Deploying image: $IMAGE_TAG"

            docker pull $IMAGE_TAG

            docker compose down

            IMAGE_TAG=$IMAGE_TAG docker compose up -d

            docker compose exec -T api pnpm run migration:run:prod

      - name: Deploy to Digital Ocean (Main)
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@master

        env:
          IMAGE_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ github.sha }}
        
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}

          envs: IMAGE_TAG
          
          script: |
            cd /root/var/www/arkrides_nestjs_backend
            
            echo "${{ secrets.ENV_MAIN }}" > .env

            echo "Deploying image: $IMAGE_TAG"
            
            docker pull $IMAGE_TAG
            
            export IMAGE_TAG="$IMAGE_TAG"

            docker compose down

            IMAGE_TAG=$IMAGE_TAG docker compose up -d

            docker compose exec -T api pnpm run migration:run:prod