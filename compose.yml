
services:

  api: 
    image: ${IMAGE_TAG:-arkrides-api:latest}
    build:
      context: ./
      target: production
    container_name: arkrides-api
    restart: unless-stopped
    env_file: .env
    environment:
      # Stated explicitly, and LAST, so it wins over anything in .env.
      #
      # This file is what the deploy workflow brings up, and it used to take
      # NODE_ENV from .env alone — where .env.example sets `development`. A
      # production host that copied the example would have served Swagger
      # publicly, allowlisted localhost for CORS, and skipped every
      # production-only environment check.
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - '4010:4010'
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: arkrides-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-arkrides}
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres} -d ${DATABASE_NAME:-arkrides}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # The password is supplied by the environment. It used to be the literal
    # string `redis_password_dev`, committed to the repository.
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  postgres_data: