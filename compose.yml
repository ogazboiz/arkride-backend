
services:

  api: 
    image: ${IMAGE_TAG:-arkrides-api:latest}
    build:
      context: ./
      target: production
    container_name: arkrides-api
    restart: unless-stopped
    env_file: .env
    ports:
      - '4010:4010'

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass redis_password_dev
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data: