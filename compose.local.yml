name: arkrides-local

services:
  
  api-staging:
    build: 
      context: ./
      target: production
    restart: unless-stopped
    # Falls back to .env so a fresh clone can run `docker compose -f
    # compose.local.yml up` without first inventing two more env files.
    env_file:
      - path: .env.staging
        required: false
      - path: .env
        required: false
    ports:
      - '4010:4010'
    environment:
      - NODE_ENV=staging
      - PORT=4010
    depends_on:
      redis: 
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - arkrides-network

# Main/Production environment on port 4011
  api-main: 
    build: 
      context: ./
      target: production
    restart: unless-stopped
    env_file:
      - path: .env.main
        required: false
      - path: .env
        required: false
    ports:
      - '4011:4010'
    environment: 
      - NODE_ENV=production
      - PORT=4010
    depends_on:
      redis: 
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks: 
      - arkrides-network

# nginx:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
     - ./nginx.local.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-staging
      - api-main
    networks:
      - arkrides-network

  postgres:
    image: postgres:16-alpine
    container_name: arkrides-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-arkrides}
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres} -d ${DATABASE_NAME:-arkrides}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - arkrides-network

  redis:
    image: redis:7-alpine
    container_name: arkrides-redis-local
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    # The password comes from the environment and must match REDIS_PASSWORD in
    # the API's env file. It used to be the literal string `redis_password_dev`
    # committed here, which meant either the app could not authenticate or
    # everyone shared a password published in the repository.
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      # Host port from REDIS_PORT so a Redis you already run does not collide.
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      # Must authenticate, or the check fails against a password-protected
      # server and the api services never start.
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arkrides-network

volumes:
  redis_data:
  postgres_data:

networks:
  arkrides-network:
    driver: bridge